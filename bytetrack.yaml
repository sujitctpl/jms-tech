# ByteTrack tracker configuration for showroom / CCTV edge detector
# Reference: https://docs.ultralytics.com/modes/track

tracker_type: bytetrack  # (str) Tracker backend: bytetrack
track_high_thresh: 0.20  # (float) First-stage match threshold
track_low_thresh: 0.10   # (float) Second-stage threshold for low-score matches
new_track_thresh: 0.20   # (float) Minimum confidence to initiate a new tracklet (filters out weak noise)
track_buffer: 150        # (int) Frames to keep lost tracks alive (~5-7s across temporary occlusions & seated pauses)
match_thresh: 0.50       # (float) Association similarity threshold (IoU/cost, lower prevents constant ID flips)
fuse_score: True         # (bool) Fuse detection score with motion/IoU for matching
